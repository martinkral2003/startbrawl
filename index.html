<title>Star Brawl</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;color:#dfe6f5;font:15px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .panel{pointer-events:auto;background:#151a2bf2;border:1px solid #2a3350;border-radius:12px;padding:18px;width:min(340px,92vw);max-height:92vh;overflow:auto;box-shadow:0 10px 40px #000a}
  h1,h2{margin:0 0 10px;font-weight:700}
  .dim{color:#8a93a8;font-size:13px}
  .err{color:#ff7a7a;margin:0 0 10px}
  input{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 8px;border-radius:8px;border:1px solid #2a3350;background:#0b0e17;color:#fff;font:inherit}
  button{width:100%;padding:10px;margin:4px 0;border:0;border-radius:8px;background:#3b6df0;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.sec{background:#2a3350}
  button:disabled{opacity:.4;cursor:default}
  .row{display:flex;align-items:center;gap:8px;padding:4px 0}
  .row .tm{width:auto;margin:0;padding:3px 10px;font-size:12px}
  .row .x{width:auto;margin:0 0 0 auto;padding:2px 8px;background:#2a3350}
  .code{font-size:28px;letter-spacing:6px;text-align:center;margin:4px 0;font-weight:800}
</style>
